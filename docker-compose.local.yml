services:
  db:
    container_name: db
    hostname: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-LkzPjQKGLT2FXTbjVJcavSNL5WMGxi!1}
      - POSTGRES_DB=netcore-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netcore-network

  redis:
    container_name: redis
    hostname: redis
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
    networks:
      - netcore-network

  # Dozzle removed - Use Aspire Dashboard instead (http://localhost:15888)
  # If you need it for full Docker mode, uncomment below:
  # dozzle:
  #   container_name: dozzle
  #   image: amir20/dozzle:latest
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   ports:
  #     - 8080:8080
  #   networks:
  #     - netcore-network

  netcore-migration:
    container_name: netcore-migration
    hostname: netcore-migration
    build:
      context: .
      dockerfile: src/client/NetCore.Migration/Dockerfile
    # Run the published DLL directly; the image already contains the build output
    command: ["dotnet", "NetCore.Migration.dll", "-d", "-m", "-s", "-t"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    networks:
      - netcore-network

  netcore-api:
    container_name: netcore-api
    hostname: netcore-api
    build:
      context: .
      dockerfile: src/client/NetCore.Api/Dockerfile
    depends_on:
      netcore-migration:
        condition: service_completed_successfully
    ports:
      - 6000:80
      - 6001:443
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=${ASPNETCORE_Kestrel__Certificates__Default__Path}
    volumes:
      - ./certificates/.netcore-api/https:/https:ro
    networks:
      - netcore-network
    restart: always

  # netcore-ui:
  #   container_name: netcore-ui
  #   hostname: netcore-ui
  #   build:
  #     context: .
  #     dockerfile: src/client/NetCore.UI/Dockerfile
  #   depends_on:
  #     - netcore-api
  #   ports:
  #     - 6010:80
  #     - 6011:443
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
  #     - ASPNETCORE_URLS=${ASPNETCORE_URLS}
  #     - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password}
  #     - ASPNETCORE_Kestrel__Certificates__Default__Path=${ASPNETCORE_Kestrel__Certificates__Default__Path}
  #   volumes:
  #     - ./certificates/.netcore-api/https:/https:ro
  #   networks:
  #     - netcore-network
  #   restart: always

volumes:
  postgres_data:

networks:
  netcore-network:
    external: true 

 